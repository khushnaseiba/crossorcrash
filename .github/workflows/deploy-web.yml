name: Build and Deploy Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -O godot.zip

          unzip -q godot.zip

          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot

          godot --version

      - name: Install Web export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz \
            -O /tmp/templates.tpz

          unzip -q /tmp/templates.tpz -d /tmp/godot-templates

          cp -r \
            /tmp/godot-templates/templates/* \
            ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Export Web
        run: |
          mkdir -p build/web

          godot \
            --headless \
            --path . \
            --export-release "Web" \
            build/web/index.html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
